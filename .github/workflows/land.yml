name: land
on:
  workflow_dispatch:
    inputs:
      key:
        description: 'input tar name (without .tar), e.g. cd90'
        required: true
jobs:
  render:
    runs-on: ubuntu-latest
    container: python:3.12-slim-trixie
    env:
      GH_TOKEN: ${{ github.token }}
      K: ${{ inputs.key }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update && apt-get install -y --no-install-recommends ffmpeg libsndfile1 curl ca-certificates
          pip install -r requirements.txt
      - name: fetch inputs
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/${{ github.repository }}/releases/tags/inputs | python -c "import json,sys;print([a['url'] for a in json.load(sys.stdin)['assets'] if a['name']=='$K.tar'][0])")" -o in.tar
          mkdir -p job && tar -xf in.tar -C job
      - name: render
        run: |
          set -o pipefail
          python src/land.py job/${K}_land.json job/${K}_words.json job/${K}_vo.wav job/$K.mp4 2>&1 | tee job/$K.render.log
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.K }}
          path: |
            job/${{ env.K }}.mp4
            job/${{ env.K }}.render.log
            job/${{ env.K }}_contact.png
            job/${{ env.K }}_chunks.json
          retention-days: 3
